name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_NAME: AnimatedPhotoExporter
  ARTIFACT_NAME: release-artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare fallback references
        shell: bash
        run: |
          mkdir -p Resonite
          curl -sSfL -o Resonite/ResoniteModLoader.dll https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/ResoniteModLoader.dll
          curl -sSfL -o Resonite/0Harmony.dll https://github.com/resonite-modding-group/ResoniteModLoader/releases/latest/download/0Harmony.dll

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: bash
        run: |
          dotnet restore

      - name: Verify formatting (dotnet format)
        shell: bash
        run: |
          dotnet format whitespace --verify-no-changes --no-restore
          dotnet format style --verify-no-changes --no-restore --severity info
          dotnet format analyzers --verify-no-changes --no-restore --severity info

      - name: Build
        shell: bash
        run: |
          dotnet build --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          dotnet test --configuration Release --no-build

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          artifacts_dir="${{ env.ARTIFACT_NAME }}"
          project_name="${{ env.PROJECT_NAME }}"
          package_dir="$artifacts_dir/package"
          mkdir -p "$package_dir/rml_mods" "$package_dir/rml_libs/runtimes/win-x64/native"
          cp "$project_name/bin/Release/$project_name.dll" "$package_dir/rml_mods/$project_name.dll"
          cp "$HOME/.nuget/packages/magick.net-q8-anycpu/14.16.0/lib/net8.0/Magick.NET-Q8-AnyCPU.dll" "$package_dir/rml_libs/"
          cp "$HOME/.nuget/packages/magick.net.core/14.16.0/lib/net8.0/Magick.NET.Core.dll" "$package_dir/rml_libs/"
          cp "$HOME/.nuget/packages/magick.net-q8-anycpu/14.16.0/runtimes/win-x64/native/Magick.Native-Q8-x64.dll" "$package_dir/rml_libs/runtimes/win-x64/native/"
          cp README.md LICENSE "$package_dir/"
          cp "$HOME/.nuget/packages/magick.net-q8-anycpu/14.16.0/Notice.txt" "$package_dir/THIRD-PARTY-NOTICES.txt"
          if [ -f "$project_name/bin/Release/$project_name.pdb" ]; then
            cp "$project_name/bin/Release/$project_name.pdb" "$package_dir/rml_mods/$project_name.pdb"
          fi
          (cd "$package_dir" && zip -r "../$project_name-${GITHUB_REF_NAME}.zip" .)

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}/${{ env.PROJECT_NAME }}-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ env.ARTIFACT_NAME }}/${{ env.PROJECT_NAME }}-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --generate-notes \
            --title "${{ env.PROJECT_NAME }} ${GITHUB_REF_NAME}"
